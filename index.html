<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What If 8 Billion People Jumped at Once?</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Impact', 'Inter', system-ui, sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      cursor: pointer;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      pointer-events: none;
    }

    .subtitle-banner {
      width: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(5,7,15,0.95) 35%, rgba(5,7,15,1) 100%);
      padding: 30px 40px 40px 40px;
      text-align: center;
      border-top: none;
    }

    .main-text {
      font-size: 3.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffdd00;
      text-shadow: 0 0 20px rgba(255, 221, 0, 0.3);
      line-height: 1.1;
      opacity: 0;
      transform: translateY(10px);
    }

    .narrator-sub {
      font-family: 'Inter', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: #d1d5db;
      margin-top: 8px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .countdown-display {
      font-size: 9rem;
      color: #ff1144;
      text-shadow: 0 0 50px #ff1144;
      opacity: 0;
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="overlay">
    <div class="countdown-display" id="countdown">3</div>

    <div class="subtitle-banner">
      <div class="main-text" id="main-text">CAN WE MOVE EARTH?</div>
      <div class="narrator-sub" id="narrator-text">“If all 8 billion people on Earth jumped at the exact same millisecond… could we knock the planet out of orbit?”</div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. THREE.JS SCENE SETUP
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    const cameraRig = new THREE.Group();
    cameraRig.add(camera);
    scene.add(cameraRig);

    camera.position.set(0, 0, 17.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
    sunLight.position.set(30, 20, 25);
    scene.add(sunLight);

    // -------------------------------------------------------------
    // 2. COSMIC NEBULA BACKGROUND
    // -------------------------------------------------------------
    function createGlowTexture(color1, color2) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, color1);
      gradient.addColorStop(0.4, color2);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    const starTexture = createGlowTexture('rgba(255,255,255,1)', 'rgba(150,200,255,0.6)');
    const cyanNebulaTex = createGlowTexture('rgba(0,180,255,0.4)', 'rgba(10,40,90,0.1)');
    const magentaNebulaTex = createGlowTexture('rgba(180,0,255,0.3)', 'rgba(40,10,70,0.1)');

    const starGeo = new THREE.BufferGeometry();
    const starCount = 3500;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 800;
      starPos[i * 3 + 1] = (Math.random() - 0.5) * 800;
      starPos[i * 3 + 2] = -200 - Math.random() * 400;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ size: 1.8, map: starTexture, transparent: true, blending: THREE.AdditiveBlending });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    const nebCount = 400;
    const nebGeo1 = new THREE.BufferGeometry();
    const nebPos1 = new Float32Array(nebCount * 3);
    for (let i = 0; i < nebCount; i++) {
      nebPos1[i * 3] = (Math.random() - 0.5) * 600;
      nebPos1[i * 3 + 1] = (Math.random() - 0.5) * 600;
      nebPos1[i * 3 + 2] = -150 - Math.random() * 300;
    }
    nebGeo1.setAttribute('position', new THREE.BufferAttribute(nebPos1, 3));
    const nebMat1 = new THREE.PointsMaterial({ size: 90, map: cyanNebulaTex, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false });
    const nebula1 = new THREE.Points(nebGeo1, nebMat1);
    scene.add(nebula1);

    const nebGeo2 = new THREE.BufferGeometry();
    const nebPos2 = new Float32Array(nebCount * 3);
    for (let i = 0; i < nebCount; i++) {
      nebPos2[i * 3] = (Math.random() - 0.5) * 600;
      nebPos2[i * 3 + 1] = (Math.random() - 0.5) * 600;
      nebPos2[i * 3 + 2] = -150 - Math.random() * 300;
    }
    nebGeo2.setAttribute('position', new THREE.BufferAttribute(nebPos2, 3));
    const nebMat2 = new THREE.PointsMaterial({ size: 110, map: magentaNebulaTex, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
    const nebula2 = new THREE.Points(nebGeo2, nebMat2);
    scene.add(nebula2);

    // -------------------------------------------------------------
    // 3. CLEAN EARTH MODEL (Shifted Upwards)
    // -------------------------------------------------------------
    const earthGroup = new THREE.Group();
    earthGroup.position.set(0, 1.3, 0); // Positioned higher up to clear the text banner completely
    const earthRadius = 3.5;

    const textureLoader = new THREE.TextureLoader();
    const earthTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
    const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
    const earthMat = new THREE.MeshPhongMaterial({ map: earthTex, shininess: 12 });
    const earthMesh = new THREE.Mesh(earthGeo, earthMat);
    earthGroup.add(earthMesh);

    // Glowing Atmosphere Ring
    const atmosGeo = new THREE.SphereGeometry(earthRadius + 0.12, 32, 32);
    const atmosMat = new THREE.MeshBasicMaterial({ color: 0x0099ff, transparent: true, opacity: 0.2, side: THREE.BackSide });
    const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
    earthGroup.add(atmosMesh);

    scene.add(earthGroup);

    // Shockwave Ring (Used for impact scene)
    const ringGeo = new THREE.RingGeometry(0.1, 0.3, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff2200, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.position.set(0, 0, earthRadius + 0.06);
    earthGroup.add(ringMesh);

    // -------------------------------------------------------------
    // 4. SCRIPT STAGES & CAMERA MOVES
    // -------------------------------------------------------------
    let currentStage = 0;

    const scenes = [
      { // 0: HOOK
        text: "CAN WE MOVE EARTH?",
        narrator: "“If all 8 billion people on Earth jumped at the exact same millisecond… could we knock the planet out of orbit?”",
        color: "#ffdd00",
        action: () => {
          gsap.to(cameraRig.rotation, { x: 0, y: 0, z: 0, duration: 2.0, ease: "power2.inOut" });
          gsap.to(camera.position, { x: 0, y: 0, z: 17.5, duration: 2.0, ease: "power2.inOut" });
        }
      },
      { // 1: THE SETUP
        text: "8,000,000,000 PEOPLE",
        narrator: "“Imagine gathering every living human into one massive crowd covering an area the size of Los Angeles. Everyone crouches...”",
        color: "#00ccff",
        action: () => {
          gsap.to(cameraRig.rotation, { x: -0.05, y: 0.05, duration: 1.8, ease: "power3.out" });
          gsap.to(camera.position, { z: 13.5, y: 0, duration: 1.8, ease: "power3.out" });
        }
      },
      { // 2: THE LAUNCH
        text: "MASSIVE LAUNCH",
        narrator: "“Three. Two. One. JUMP. 300 million kilograms of human muscle kick off the ground simultaneously.”",
        color: "#ff0055",
        action: () => {
          const cd = document.getElementById('countdown');
          cd.style.opacity = 1;
          cd.innerText = "3";
          setTimeout(() => cd.innerText = "2", 800);
          setTimeout(() => cd.innerText = "1", 1600);
          setTimeout(() => { 
            cd.innerText = "JUMP!"; 
            cd.style.color = "#00ffcc"; 
            gsap.to(earthGroup.position, { y: 1.5, duration: 0.4, yoyo: true, repeat: 1 });
            gsap.to(camera.position, { x: 0.15, y: 0.1, duration: 0.06, yoyo: true, repeat: 7 });
          }, 2400);
          setTimeout(() => gsap.to(cd, { opacity: 0, duration: 0.4 }), 3200);
        }
      },
      { // 3: NEWTON'S 3RD LAW
        text: "NEWTON'S 3RD LAW",
        narrator: "“For a fraction of a second, Earth DOES react. Sir Isaac Newton guarantees it: every action has an equal and opposite reaction.”",
        color: "#ffaa00",
        action: () => {
          gsap.to(cameraRig.rotation, { y: -0.4, x: -0.1, duration: 1.8, ease: "power2.inOut" });
          gsap.to(camera.position, { z: 15.0, y: 0, duration: 1.8, ease: "power2.inOut" });
          gsap.to(earthGroup.position, { z: -0.3, duration: 0.4, yoyo: true, repeat: 1 });
        }
      },
      { // 4: SCALE COMPARISON
        text: "0.000000000001% OF EARTH",
        narrator: "“So how far does Earth move? Less than the width of a single atom. Earth weighs six sextillion tons—making humanity microscopic.”",
        color: "#00ffbb",
        action: () => {
          gsap.to(cameraRig.rotation, { x: 0, y: 0.6, duration: 2.2, ease: "power2.inOut" });
          gsap.to(camera.position, { z: 20.0, y: 0, duration: 2.2, ease: "power2.inOut" });
        }
      },
      { // 5: LANDING IMPACT
        text: "IMPACT: 4.8 MAGNITUDE",
        narrator: "“Then, we land. All that kinetic energy slams back into the crust at once, releasing a 4.8 magnitude seismic shockwave.”",
        color: "#ff2200",
        action: () => {
          gsap.to(cameraRig.rotation, { y: 0, x: 0, duration: 0.5 });
          gsap.to(camera.position, { z: 14.5, y: 0, duration: 0.5, ease: "power4.in" });

          setTimeout(() => {
            ringMat.opacity = 0.95;
            ringMesh.scale.set(1, 1, 1);
            gsap.to(ringMesh.scale, { x: 18, y: 18, duration: 1.2, ease: "power2.out" });
            gsap.to(ringMat, { opacity: 0, duration: 1.2 });
            gsap.to(camera.position, { x: 0.4, y: 0.1, duration: 0.05, yoyo: true, repeat: 11 });
          }, 350);
        }
      },
      { // 6: LOCAL DESTRUCTION
        text: "LOCAL DESTRUCTION",
        narrator: "“Windows shatter. Deafening 200-decibel sonic booms ring out across the continent. But the global orbit? Perfectly unchanged.”",
        color: "#aa00ff",
        action: () => {
          gsap.to(cameraRig.rotation, { y: -0.5, x: 0.1, duration: 2.0 });
          gsap.to(camera.position, { z: 16.5, y: 0, duration: 2.0 });
        }
      },
      { // 7: OUTRO
        text: "EARTH: UNTOUCHED 🌍",
        narrator: "“The planet returned the exact momentum we gave it. Humanity can shatter cities, but to the Earth… we are just dust.”",
        color: "#ffffff",
        action: () => {
          gsap.to(cameraRig.rotation, { y: 0, x: 0, duration: 2.5 });
          gsap.to(camera.position, { z: 17.5, y: 0, duration: 2.5 });
        }
      }
    ];

    // -------------------------------------------------------------
    // 5. ANIMATION LOOP & CONTROLS
    // -------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      earthMesh.rotation.y += 0.0016;
      nebula1.rotation.y += 0.0001;
      nebula2.rotation.y -= 0.00008;

      renderer.render(scene, camera);
    }
    animate();

    function updateStageUI(index) {
      const data = scenes[index];
      data.action();

      gsap.to("#main-text", {
        opacity: 0,
        y: 10,
        duration: 0.2,
        onComplete: () => {
          const mainTextEl = document.getElementById('main-text');
          mainTextEl.innerText = data.text;
          mainTextEl.style.color = data.color;
          document.getElementById('narrator-text').innerText = data.narrator;

          gsap.to("#main-text", { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.2)" });
        }
      });
    }

    function advanceSlide() {
      currentStage = (currentStage + 1) % scenes.length;
      updateStageUI(currentStage);
    }

    updateStageUI(0);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        advanceSlide();
      }
    });

    window.addEventListener('click', advanceSlide);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
